<!doctype html><html lang="uz"><head><meta charset="utf-8"><title>Variant 5 — Xiva majolikasi</title>
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../common.css">
<style>
:root{--cob:#123a8c;--tq:#1fb5c9;--tq2:#8fe3ec;--ivory:#fffaf0;--gold:#d9a441;--ffg:#fff;--fbg:#0b2563}
.poster{background:var(--cob)}
.pat{position:absolute;inset:0}
.arch{position:absolute;left:110px;right:110px;top:90px;bottom:170px;background:var(--ivory);border-radius:430px 430px 18px 18px;box-shadow:0 0 0 14px var(--tq),0 0 0 18px var(--ivory),0 0 0 26px var(--gold),0 30px 60px rgba(0,0,0,.4)}
.arch:before{content:"";position:absolute;inset:22px;border:2px solid var(--tq);border-radius:410px 410px 8px 8px}
.content{position:absolute;left:170px;right:170px;top:150px;bottom:210px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
.logo{width:200px;height:200px;border-radius:50%;margin-top:10px}
.star{width:60px;height:60px;color:var(--tq)}
.kicker{font:700 22px/1.3 'Montserrat';letter-spacing:.26em;color:var(--tq);padding-left:.26em}
.title{font:700 70px/1.03 'Cormorant Garamond';color:var(--cob);text-transform:uppercase}
.title em{font-style:normal;color:#0f8fa3}
.line{width:300px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.date{font:700 32px/1.2 'Montserrat';color:var(--cob)}
.date small{display:block;font:600 22px/1.5 'Montserrat';color:#0f8fa3;letter-spacing:.14em}
.skyline{position:absolute;left:150px;width:780px;bottom:196px;height:260px;color:#1fb5c9;opacity:.9}
.skyline .band{stroke:#fffaf0}
.dirs{font:600 20px/1.5 'Montserrat';letter-spacing:.12em;color:var(--cob);opacity:.8}
.org{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;white-space:nowrap;padding:12px 26px;border-radius:30px;background:var(--cob);border:2px solid var(--gold);font:600 20px/1 'Montserrat';letter-spacing:.3em;color:var(--tq2)}
</style></head><body><div class="poster">
<svg class="pat" width="100%" height="100%"><defs><pattern id="m" width="120" height="120" patternUnits="userSpaceOnUse">
<rect width="120" height="120" fill="#123a8c"/>
<g transform="translate(60 60)"><polygon points="0,-46 13,-13 46,0 13,13 0,46 -13,13 -46,0 -13,-13" fill="#1fb5c9"/><polygon points="-32,-32 0,-18 32,-32 18,0 32,32 0,18 -32,32 -18,0" fill="#1fb5c9" opacity=".55"/><circle r="14" fill="#fffaf0"/><circle r="6" fill="#123a8c"/></g>
<g fill="#fffaf0" opacity=".85"><circle cx="0" cy="0" r="7"/><circle cx="120" cy="0" r="7"/><circle cx="0" cy="120" r="7"/><circle cx="120" cy="120" r="7"/></g>
<path d="M0 60H14M106 60H120M60 0V14M60 106V120" stroke="#8fe3ec" stroke-width="3"/>
</pattern></defs><rect width="100%" height="100%" fill="url(#m)"/></svg>
<div class="arch"></div>
<div class="content">
 <img class="logo" src="../assets/logo.png" alt="">
 <div class="kicker">XALQARO ILMIY-AMALIY ANJUMAN</div>
 <svg class="star" viewBox="0 0 60 60" fill="currentColor"><polygon points="30,2 37,23 58,30 37,37 30,58 23,37 2,30 23,23"/><circle cx="30" cy="30" r="6" fill="#fffaf0"/></svg>
 <div class="title">«Innovatsion pedagogika: tabiiy va aniq fanlarni o‘qitishda <em>global tajriba</em> va <em>mahalliy yechimlar</em>»</div>
 <div class="line"></div>
 <div class="date">2026-yil 12-oktabr<small>URGANCH · O‘ZBEKISTON</small></div>
</div>
{{SKYLINE}}
<div class="org">URGANCH DAVLAT PEDAGOGIKA INSTITUTI</div>
{{FOOTER}}
</div></body></html>
