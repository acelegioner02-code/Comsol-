<style>
body{width:1080px;height:1620px;background:#eaf4fb}
.bg{position:absolute;inset:0;background:url(../../assets/bg_up.jpg) center top/1080px 1620px no-repeat}
.haze{position:absolute;inset:0;background:radial-gradient(ellipse 700px 510px at 50% 410px,#fff 0,#fff 72%,rgba(255,255,255,.85) 80%,rgba(255,255,255,0) 100%)}
.frame{position:absolute;left:26px;right:26px;top:26px;bottom:122px;border:3px solid #c99a3c;outline:1.5px solid #c99a3c;outline-offset:-11px;z-index:2}
.frame b{position:absolute;width:30px;height:30px;background:#c99a3c;transform:rotate(45deg)}
.frame b:nth-child(1){left:-17px;top:-17px}.frame b:nth-child(2){right:-17px;top:-17px}.frame b:nth-child(3){left:-17px;bottom:-17px}.frame b:nth-child(4){right:-17px;bottom:-17px}
.logo{position:absolute;left:50%;top:62px;width:270px;height:270px;transform:translateX(-50%);filter:drop-shadow(0 6px 14px rgba(20,40,100,.2))}
.logo .logo-svg{width:100%;height:100%}
.kicker{position:absolute;top:358px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 23.5px/1 'Montserrat';color:#fff;letter-spacing:.04em;background:linear-gradient(90deg,#0f2f7e,#1747a6);padding:15px 34px;border-radius:40px;box-shadow:0 8px 20px rgba(15,47,126,.25)}
.title{position:absolute;top:448px;left:0;right:0;text-align:center;font:800 51px/62px 'Montserrat';color:#151c4e}
.title em{font-style:normal;background:linear-gradient(90deg,#1747a6,#1d8fd1);-webkit-background-clip:text;color:transparent}
.title b{color:#c08a22}
.date{position:absolute;top:712px;left:50%;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap;border-radius:60px;overflow:hidden;border:2.5px solid #c99a3c;background:#fff;box-shadow:0 8px 24px rgba(20,40,100,.15)}
.date .i{display:flex;align-items:center;padding:10px 18px;background:#fff6e0;border-right:2.5px solid #c99a3c}
.cal{width:44px;height:44px}
.date span{padding:0 30px;font:700 31px/1 'Montserrat';color:#151c4e}
.date span small{font-weight:600;color:#1747a6;font-size:31px}
.clean{position:absolute;top:688px;left:112px;right:118px;height:84px;background:#fff;filter:blur(12px)}
</style></head><body>
