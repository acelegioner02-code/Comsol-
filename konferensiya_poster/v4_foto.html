<!doctype html><html lang="uz"><head><meta charset="utf-8"><title>Variant 4 — Foto va gradient</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
<style>
:root{--teal:#0a6c86;--deep:#062a49;--sun:#ffc83d;--ffg:#e6f6fb;--fbg:#041d33}
.poster{background:linear-gradient(180deg,var(--teal) 0%,#08486b 55%,var(--deep) 100%)}
.photo{position:absolute;left:0;right:0;bottom:96px;height:720px;background:url(assets/scene.jpg) center/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a6c86 0%,rgba(10,108,134,.75) 18%,rgba(10,108,134,0) 45%,rgba(4,29,51,0) 80%,rgba(4,29,51,.85) 100%)}
.tiles{position:absolute;left:0;right:0;top:0;height:28px;background:repeating-linear-gradient(90deg,#ffc83d 0 28px,#0a6c86 28px 56px,#fff 56px 84px,#0a6c86 84px 112px)}
.tiles2{position:absolute;left:0;right:0;top:28px;height:6px;background:#ffc83d}
.content{position:absolute;top:74px;left:70px;right:70px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.logo{display:flex;align-items:center;gap:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);padding:10px 30px 10px 10px;border-radius:80px;backdrop-filter:blur(6px)}
.logo img{width:110px;height:110px;border-radius:50%;background:#fff}
.logo div{text-align:left;font:700 20px/1.35 'Montserrat';color:#fff;letter-spacing:.08em}
.kicker{margin-top:14px;font:600 26px/1 'Montserrat';letter-spacing:.3em;color:var(--sun);padding-left:.3em}
.title{font:900 70px/1.04 'Montserrat';color:#fff;text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.title em{font-style:normal;color:var(--sun)}
.date{display:flex;gap:0;border-radius:60px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);font:700 30px/1 'Montserrat'}
.date span{padding:20px 34px;background:#fff;color:var(--deep)}
.date span+span{background:var(--sun)}
</style></head><body><div class="poster">
<div class="photo"></div>
<div class="tiles"></div><div class="tiles2"></div>
<div class="content">
 <div class="logo"><img src="assets/logo.png" alt=""><div>URGANCH DAVLAT<br>PEDAGOGIKA INSTITUTI</div></div>
 <div class="kicker">XALQARO ILMIY-AMALIY ANJUMAN</div>
 <div class="title">«Innovatsion pedagogika: tabiiy va aniq fanlarni o‘qitishda <em>global tajriba</em> va <em>mahalliy yechimlar</em>»</div>
 <div class="date"><span>Urganch</span><span>12-oktabr, 2026</span></div>
</div>
<div class="footer">
<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3 4.5 6.5 4.5 10S15 19 12 22c-3-3-4.5-6.5-4.5-10S9 5 12 2z"/></svg>www.urspi.uz</span><i></i>
<span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.2h2.8l.4-3.2h-3.2V8.5c0-.9.3-1.6 1.6-1.6h1.7V4.1c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H7.3v3.2h2.8V22z"/></svg>facebook.com/urspi.uz</span><i></i>
<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>instagram.com/urspi.uz</span><i></i>
<span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 3.6 2.9 10.7c-1.2.5-1.2 1.3-.2 1.6l4.7 1.5 1.8 5.5c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5zM9.6 14.2l8.6-7.8c.4-.3-.1-.5-.6-.2L7.8 13l.3-.1z"/></svg>t.me/urspiuz</span>
</div>

</div></body></html>
